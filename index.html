<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiwifyx Downloader</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #18191a);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }
        h2 {
            text-align: center;
            margin-bottom: 10px;
        }
        input {
            padding: 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background-color: var(--tg-theme-secondary-bg-color, #242526);
            color: inherit;
            font-size: 16px;
            outline: none;
        }
        button {
            padding: 14px;
            border-radius: 10px;
            border: none;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:active {
            opacity: 0.8;
        }
        #result {
            margin-top: 15px;
            text-align: center;
            word-break: break-all;
        }
        .download-link {
            display: block;
            margin-top: 10px;
            padding: 12px;
            background: #2ea44f;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Kiwifyx Downloader</h2>
        <input type="text" id="mediaUrl" placeholder="Вставь ссылку (YouTube, TikTok...)">
        <button onclick="getMedia()">Скачать</button>
        <div id="result"></div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        async function getMedia() {
            let url = document.getElementById('mediaUrl').value.trim();
            let resultDiv = document.getElementById('result');

            if (!url) {
                resultDiv.innerHTML = "❌ Введи ссылку!";
                return;
            }

            resultDiv.innerHTML = "⏳ Обработка ссылки...";

            try {
                // Используем стабильный публичный API для скачивания прямо из браузера
                let response = await fetch('https://api.cobalt.tools/api/json', {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        url: url,
                        vQuality: '720'
                    })
                });

                let data = await response.json();

                if (data.status === 'stream' || data.status === 'redirect') {
                    resultDiv.innerHTML = `<a class="download-link" href="${data.url}" target="_blank">📥 Скачать файл</a>`;
                } else if (data.status === 'picker') {
                    let html = '<b>Выбери формат:</b><br>';
                    data.picker.forEach(item => {
                        html += `<a class="download-link" href="${item.url}" target="_blank">🔗 Скачать (${item.type || 'файл'})</a>`;
                    });
                    resultDiv.innerHTML = html;
                } else {
                    resultDiv.innerHTML = "❌ Не удалось получить ссылку на файл.";
                }
            } catch (err) {
                resultDiv.innerHTML = "❌ Ошибка соединения: " + err.message;
            }
        }
    </script>
</body>
</html>
