<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiwifyx App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0b0b0b;
      color: #ffffff;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background-color: #000000;
      border: 1px solid #1f1f1f;
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: #8e8e93;
      text-transform: lowercase;
      letter-spacing: 0.5px;
    }

    .white-box {
      background-color: #ffffff;
      border-radius: 8px;
      border: none;
      outline: none;
      color: #000000;
    }

    /* 1. MENU SECTION */
    .menu-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .menu-btn {
      aspect-ratio: 1 / 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }

    .menu-btn svg {
      width: 28px;
      height: 28px;
      fill: #000000;
    }

    /* 2. VIDEO DOWNLOAD SECTION */
    .input-full {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      font-size: 14px;
      font-weight: 500;
    }

    .video-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .preview-box {
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #1a1a1a;
      border-radius: 8px;
    }

    .preview-box svg {
      width: 40px;
      height: 40px;
      fill: #ffffff;
      opacity: 0.8;
    }

    .video-actions {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .action-btn {
      height: 44px;
      width: 100%;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* 3. MUSIC DOWNLOAD SECTION */
    .music-box {
      display: flex;
      gap: 8px;
    }

    .music-box input {
      flex: 1;
    }

    .music-box button {
      width: 44px;
      height: 44px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .music-box button svg {
      width: 20px;
      height: 20px;
      fill: #000000;
    }
  </style>
</head>
<body>

  <!-- MENU -->
  <div class="card">
    <div class="card-title">menu</div>
    <div class="menu-grid">
      <button class="white-box menu-btn" onclick="sendToBot('/photo cat')">
        <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
        Photo
      </button>
      <button class="white-box menu-btn" onclick="sendToBot('/music top 2026')">
        <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        Top Music
      </button>
    </div>
  </div>

  <!-- VIDEO DOWNLOAD -->
  <div class="card">
    <div class="card-title">video download</div>
    <input type="text" id="videoUrl" class="white-box input-full" placeholder="Вставьте ссылку на видео...">
    
    <div class="video-grid">
      <div class="preview-box">
        <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
      </div>
      <div class="video-actions">
        <button class="white-box action-btn" onclick="sendVideo()">Скачать</button>
      </div>
    </div>
  </div>

  <!-- MUSIC DOWNLOAD -->
  <div class="card">
    <div class="card-title">music download</div>
    <div class="music-box">
      <input type="text" id="musicQuery" class="white-box input-full" placeholder="Название трека или ссылка...">
      <button class="white-box" onclick="sendMusic()">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    function sendToBot(text) {
      if (text) {
        tg.sendData(text);
      }
    }

    function sendVideo() {
      const url = document.getElementById('videoUrl').value.trim();
      if (url) {
        sendToBot(`/video 1080p ${url}`);
      }
    }

    function sendMusic() {
      const query = document.getElementById('musicQuery').value.trim();
      if (query) {
        sendToBot(`/music ${query}`);
      }
    }
  </script>
</body>
</html>
