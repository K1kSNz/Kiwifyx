<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiwifyx</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #181818;
            --hover-bg: #282828;
            --input-bg: #0f0f0f;
            --border-color: #2a2a2a;
            --text-main: #e1e1e1;
            --text-sub: #888888;
            --accent-green: #1db954;
            --accent-red: #ff0000;
            --accent-blue: #0088cc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Consolas, monospace; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 12px; display: flex; flex-direction: column; align-items: center; }
        .header { width: 100%; max-width: 500px; font-size: 14px; font-weight: bold; margin-bottom: 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
        .back-btn { display: none; width: 100%; max-width: 500px; background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color); padding: 8px; font-size: 12px; cursor: pointer; margin-bottom: 10px; }
        .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 6px; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 10px; cursor: pointer; }
        .card-title { font-size: 13px; font-weight: bold; }
        .card-content { display: none; margin-top: 10px; }
        input { width: 100%; background: var(--input-bg); border: 1px solid var(--border-color); padding: 8px; color: var(--text-main); font-size: 12px; outline: none; }
        .status { font-size: 11px; color: var(--text-sub); margin-top: 6px; display: none; }
        .results-list { margin-top: 8px; max-height: 380px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
        
        /* Стили списка результатов */
        .track-item { display: flex; align-items: center; background: var(--input-bg); border: 1px solid var(--border-color); padding: 8px; cursor: pointer; gap: 10px; }
        .track-item:hover { background: var(--hover-bg); }
        .music-cover { width: 45px; height: 45px; border-radius: 4px; object-fit: cover; background: #222; }
        .video-cover { width: 70px; height: 40px; border-radius: 4px; object-fit: cover; background: #222; }
        
        .track-info { display: flex; flex-direction: column; overflow: hidden; }
        .track-title { font-size: 12px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-artist { font-size: 11px; color: var(--text-sub); margin-top: 2px; }
        
        .btn-action { margin-top: 8px; width: 100%; border: none; color: white; padding: 10px; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .btn-music { background: var(--accent-green); }
        .btn-video { background: var(--accent-red); }
        .btn-photo { background: var(--accent-blue); }
    </style>
</head>
<body>

    <div class="header">Kiwifyx / Control Panel</div>
    <button class="back-btn" id="backBtn" onclick="resetMenu()">&lt; Назад</button>

    <div class="container">
        <!-- МУЗЫКА И SPOTIFY -->
        <div class="card" id="card-music" onclick="openCard('music')">
            <div class="card-title">🎵 Music & Spotify Search</div>
            <div class="card-content" id="content-music">
                <input type="text" id="input-music" placeholder="Ссылка Spotify/URL или название песни..." oninput="handleMusicInput()" onclick="event.stopPropagation()">
                <div class="status" id="status-music">Поиск треков...</div>
                <div class="results-list" id="results-music"></div>
            </div>
        </div>

        <!-- ВИДЕО YOUTUBE -->
        <div class="card" id="card-video" onclick="openCard('video')">
            <div class="card-title">🎥 YouTube Video Search</div>
            <div class="card-content" id="content-video">
                <input type="text" id="input-video" placeholder="Ссылка YouTube или название видео..." oninput="handleVideoInput()" onclick="event.stopPropagation()">
                <div class="status" id="status-video">Поиск роликов...</div>
                <div class="results-list" id="results-video"></div>
            </div>
        </div>

        <!-- ФОТО -->
        <div class="card" id="card-photo" onclick="openCard('photo')">
            <div class="card-title">🖼 Photo Search</div>
            <div class="card-content" id="content-photo">
                <input type="text" id="input-photo" placeholder="Название картинки..." oninput="handleDirectText('photo')" onclick="event.stopPropagation()">
                <div class="results-list" id="results-photo"></div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let activeType = null;
        let searchTimeout = null;

        function openCard(type) {
            if (activeType) return;
            activeType = type;
            ['music', 'photo', 'video'].forEach(t => {
                if (t !== type) document.getElementById(`card-${t}`).style.display = 'none';
            });
            document.getElementById(`content-${type}`).style.display = 'block';
            document.getElementById('backBtn').style.display = 'block';
        }

        function resetMenu() {
            ['music', 'photo', 'video'].forEach(t => {
                document.getElementById(`card-${t}`).style.display = 'block';
                document.getElementById(`content-${t}`).style.display = 'none';
                const input = document.getElementById(`input-${t}`);
                if (input) input.value = '';
                const res = document.getElementById(`results-${t}`);
                if (res) res.innerHTML = '';
            });
            document.getElementById('backBtn').style.display = 'none';
            activeType = null;
        }

        function sendQuery(cmd, val) {
            tg.sendData(`${cmd} ${val}`);
        }

        // РАЗДЕЛ МУЗЫКИ
        function handleMusicInput() {
            clearTimeout(searchTimeout);
            const val = document.getElementById('input-music').value.trim();
            const resBox = document.getElementById('results-music');
            const status = document.getElementById('status-music');

            if (!val) { resBox.innerHTML = ''; status.style.display = 'none'; return; }

            if (val.includes('spotify.com') || val.startsWith('http://') || val.startsWith('https://')) {
                resBox.innerHTML = `<button class="btn-action btn-music" onclick="sendQuery('/music', '${val}')">🎧 Скачать аудио по ссылке</button>`;
                return;
            }

            status.innerText = "Поиск музыки...";
            status.style.display = 'block';

            searchTimeout = setTimeout(() => {
                fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(val)}&entity=song&limit=6`)
                    .then(res => res.json())
                    .then(data => {
                        status.style.display = 'none';
                        let html = '';
                        if (data.results && data.results.length > 0) {
                            data.results.forEach(item => {
                                const fullQuery = `${item.artistName} - ${item.trackName}`;
                                html += `
                                    <div class="track-item" onclick="sendQuery('/music', '${escapeQuotes(fullQuery)}')">
                                        <img class="music-cover" src="${item.artworkUrl100}">
                                        <div class="track-info">
                                            <div class="track-title">${escapeHtml(item.trackName)}</div>
                                            <div class="track-artist">${escapeHtml(item.artistName)}</div>
                                        </div>
                                    </div>`;
                            });
                        }
                        html += `<button class="btn-action btn-music" onclick="sendQuery('/music', '${escapeQuotes(val)}')">🔍 Искать аудио: "${escapeHtml(val)}"</button>`;
                        resBox.innerHTML = html;
                    });
            }, 300);
        }

        // РАЗДЕЛ ВИДЕО
        function handleVideoInput() {
            clearTimeout(searchTimeout);
            const val = document.getElementById('input-video').value.trim();
            const resBox = document.getElementById('results-video');
            const status = document.getElementById('status-video');

            if (!val) { resBox.innerHTML = ''; status.style.display = 'none'; return; }

            if (val.startsWith('http://') || val.startsWith('https://')) {
                resBox.innerHTML = `<button class="btn-action btn-video" onclick="sendQuery('/video', '${val}')">🎥 Скачать видео по ссылке</button>`;
                return;
            }

            status.innerText = "Поиск YouTube видео...";
            status.style.display = 'block';

            searchTimeout = setTimeout(() => {
                fetch(`https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(val)}&filter=videos`)
                    .then(res => res.json())
                    .then(data => {
                        status.style.display = 'none';
                        let html = '';
                        if (data.items && data.items.length > 0) {
                            data.items.slice(0, 5).forEach(item => {
                                const videoUrl = item.url ? `https://www.youtube.com${item.url}` : val;
                                html += `
                                    <div class="track-item" onclick="sendQuery('/video', '${escapeQuotes(videoUrl)}')">
                                        <img class="video-cover" src="${item.thumbnail}">
                                        <div class="track-info">
                                            <div class="track-title">${escapeHtml(item.title)}</div>
                                            <div class="track-artist">${escapeHtml(item.uploaderName)}</div>
                                        </div>
                                    </div>`;
                            });
                        }
                        html += `<button class="btn-action btn-video" onclick="sendQuery('/video', '${escapeQuotes(val)}')">🎬 Искать ролик: "${escapeHtml(val)}"</button>`;
                        resBox.innerHTML = html;
                    })
                    .catch(() => {
                        status.style.display = 'none';
                        resBox.innerHTML = `<button class="btn-action btn-video" onclick="sendQuery('/video', '${escapeQuotes(val)}')">🎬 Найти и скачать видео: "${escapeHtml(val)}"</button>`;
                    });
            }, 300);
        }

        function handleDirectText(type) {
            const val = document.getElementById(`input-${type}`).value.trim();
            const resBox = document.getElementById(`results-${type}`);
            if (!val) { resBox.innerHTML = ''; return; }
            resBox.innerHTML = `<button class="btn-action btn-photo" onclick="sendQuery('/photo', '${escapeQuotes(val)}')">🖼 Найти фото: "${escapeHtml(val)}"</button>`;
        }

        function escapeHtml(str) { return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
        function escapeQuotes(str) { return str.replace(/'/g, "\\'").replace(/"/g, '\\"'); }
    </script>
</body>
</html>
