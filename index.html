<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiwifyx / Control Panel</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
    body { background-color: #0c0c0c; color: #e0e0e0; padding: 12px; display: flex; flex-direction: column; gap: 16px; }
    
    .header { font-size: 16px; font-weight: bold; border-bottom: 1px solid #222; padding-bottom: 6px; }

    /* Общий стиль секций */
    .section-card {
      background: #121212;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .section-title {
      font-size: 13px;
      font-weight: bold;
      color: #888;
      text-transform: lowercase;
    }

    /* 1. SECTION MENU (Сетка с пустой кнопкой) */
    .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .menu-card { 
      background: #181818; 
      border: 1px solid #282828; 
      height: 90px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-weight: bold; 
      border-radius: 4px;
      color: #fff;
    }
    .menu-card.empty {
      background: #101010;
      border: 1px dashed #222;
      color: #444;
      cursor: default;
    }

    /* 2. SECTION VIDEO DOWNLOAD */
    .video-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .preview-placeholder {
      background: #181818;
      border: 1px solid #282828;
      border-radius: 4px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      font-size: 11px;
    }
    .video-controls { display: flex; flex-direction: column; justify-content: space-between; gap: 6px; }

    /* Поля ввода и Кнопки */
    input[type="text"], select { 
      width: 100%; 
      padding: 10px; 
      background: #080808; 
      border: 1px solid #2c2c2c; 
      color: #fff; 
      border-radius: 4px; 
      outline: none; 
      font-size: 12px;
    }
    .btn-submit { 
      width: 100%; 
      padding: 10px; 
      background: #e0e0e0; 
      color: #000; 
      border: none; 
      cursor: pointer; 
      font-weight: bold; 
      border-radius: 4px; 
    }
    .btn-submit:active { background: #bbb; }

    /* 3. SECTION MUSIC DOWNLOAD */
    .results-list { display: flex; flex-direction: column; gap: 6px; }
    .track-item { display: flex; align-items: center; background: #161616; border: 1px solid #222; padding: 6px; border-radius: 4px; cursor: pointer; }
    .track-item:hover { border-color: #444; background: #1c1c1c; }
    .track-cover { width: 42px; height: 42px; border-radius: 3px; background: #222; margin-right: 10px; object-fit: cover; }
    .track-info { display: flex; flex-direction: column; }
    .track-title { font-size: 13px; font-weight: bold; color: #fff; }
    .track-artist { font-size: 11px; color: #777; margin-top: 2px; }
  </style>
</head>
<body>

  <div class="header">Kiwifyx / Control Panel</div>

  <!-- 1. SECTION MENU -->
  <div class="section-card">
    <div class="section-title">menu</div>
    <div class="menu-grid">
      <div class="menu-card" onclick="scrollToSection('video-section')">VIDEO & MUSIC</div>
      <!-- Пустая кнопка на будущее -->
      <div class="menu-card empty">+ FUTURE</div>
    </div>
  </div>

  <!-- 2. SECTION VIDEO DOWNLOAD -->
  <div id="video-section" class="section-card">
    <div class="section-title">video download</div>
    <input type="text" id="video-url" placeholder="Ссылка на YouTube...">
    
    <div class="video-layout">
      <div class="preview-placeholder">PREVIEW</div>
      <div class="video-controls">
        <select id="video-quality">
          <option value="1080p">1080p Quality</option>
          <option value="720p">720p Quality</option>
          <option value="480p">480p Quality</option>
          <option value="audio">Только звук (MP3)</option>
        </select>
        <button class="btn-submit" onclick="sendVideoRequest()">Скачать</button>
      </div>
    </div>
  </div>

  <!-- 3. SECTION MUSIC DOWNLOAD -->
  <div class="section-card">
    <div class="section-title">music download</div>
    <input type="text" id="music-search" placeholder="Поиск песни или ссылка..." oninput="searchMusic(this.value)">
    
    <div class="results-list" id="music-results">
      <div class="track-item" onclick="sendMusicRequest('Throw Away Your Mask - Lyn')">
        <div class="track-cover" style="background-color:#2a2a2a;"></div>
        <div class="track-info">
          <div class="track-title">Throw Away Your Mask</div>
          <div class="track-artist">Lyn</div>
        </div>
      </div>
      <div class="track-item" onclick="sendMusicRequest('Linear - Chinese Cigarettes')">
        <div class="track-cover" style="background-color:#2a2a2a;"></div>
        <div class="track-info">
          <div class="track-title">Linear</div>
          <div class="track-artist">Chinese Cigarettes</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    function scrollToSection(id) {
      document.getElementById(id).scrollIntoView({ behavior: 'smooth' });
    }

    function sendVideoRequest() {
      const url = document.getElementById('video-url').value.trim();
      const quality = document.getElementById('video-quality').value;
      if (!url) return alert('Вставьте ссылку!');
      
      const mode = quality === 'audio' ? 'audio' : 'video';
      tg.sendData(`${mode}|||${url}|||${quality}`);
      tg.close();
    }

    function sendMusicRequest(query) {
      tg.sendData(`audio|||${query}|||best`);
      tg.close();
    }

    function searchMusic(val) {
      if (!val.trim()) return;
      const container = document.getElementById('music-results');
      container.innerHTML = `
        <div class="track-item" onclick="sendMusicRequest('${val}')">
          <div class="track-cover" style="background-color:#333;"></div>
          <div class="track-info">
            <div class="track-title">${val}</div>
            <div class="track-artist">Искать и скачать оригинал</div>
          </div>
        </div>
        <div class="track-item" onclick="sendMusicRequest('${val} slowed')">
          <div class="track-cover" style="background-color:#333;"></div>
          <div class="track-info">
            <div class="track-title">${val} (Slowed)</div>
            <div class="track-artist">Похожий вариант</div>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
