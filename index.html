<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiwifyx</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #181818;
            --hover-bg: #282828;
            --input-bg: #0f0f0f;
            --border-color: #2a2a2a;
            --text-main: #e1e1e1;
            --text-sub: #888888;
            --accent-color: #0088cc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Consolas, "Courier New", monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            max-width: 500px;
            text-align: left;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 12px;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .back-btn {
            display: none;
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            font-size: 12px;
            cursor: pointer;
            margin-bottom: 10px;
            text-align: left;
        }

        .back-btn:hover {
            background: var(--hover-bg);
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 10px;
            cursor: pointer;
        }

        .card-title {
            font-size: 13px;
            font-weight: bold;
            color: var(--text-main);
        }

        .card-content {
            display: none;
            margin-top: 10px;
        }

        input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 8px 10px;
            color: var(--text-main);
            font-size: 12px;
            outline: none;
        }

        .status {
            font-size: 11px;
            color: var(--text-sub);
            margin-top: 6px;
            display: none;
        }

        .results-list {
            margin-top: 8px;
            max-height: 350px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .track-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 6px 8px;
            cursor: pointer;
            gap: 10px;
            position: relative;
        }

        .track-item:hover {
            background: var(--hover-bg);
        }

        .track-left {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }

        .track-cover {
            width: 42px;
            height: 42px;
            border-radius: 4px;
            object-fit: cover;
            background: #222;
            flex-shrink: 0;
        }

        .track-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .track-title {
            font-size: 12px;
            font-weight: bold;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 11px;
            color: var(--text-sub);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* CSS Анимация скачивания */
        .loading-bar {
            display: none;
            width: 100%;
            height: 3px;
            background-color: var(--border-color);
            position: relative;
            overflow: hidden;
            margin-top: 8px;
        }

        .loading-bar::after {
            content: '';
            position: absolute;
            left: -40%;
            width: 40%;
            height: 100%;
            background-color: var(--accent-color);
            animation: loading 1.2s infinite linear;
        }

        @keyframes loading {
            0% { left: -40%; }
            100% { left: 100%; }
        }

        .toast-notify {
            display: none;
            padding: 8px;
            background: var(--card-bg);
            border: 1px solid var(--accent-color);
            color: var(--text-main);
            font-size: 11px;
            margin-top: 8px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header">Kiwifyx / Control Panel</div>

    <button class="back-btn" id="backBtn" onclick="resetMenu()">&lt; Назад</button>

    <div class="container">
        <div class="toast-notify" id="toast">⏳ Отправка команды боту... Файл появится в чате!</div>
        <div class="loading-bar" id="loader"></div>

        <!-- MUSIC -->
        <div class="card" id="card-music" onclick="openCard('music')">
            <div class="card-title">🎵 Music Search</div>
            <div class="card-content" id="content-music">
                <input type="text" id="input-music" placeholder="Песня или исполнитель..." oninput="searchItunes('music')" onclick="event.stopPropagation()">
                <div class="status" id="status-music">Поиск...</div>
                <div class="results-list" id="results-music"></div>
            </div>
        </div>

        <!-- PHOTO -->
        <div class="card" id="card-photo" onclick="openCard('photo')">
            <div class="card-title">🖼 Photo Search</div>
            <div class="card-content" id="content-photo">
                <input type="text" id="input-photo" placeholder="Название картинки..." oninput="handleDirectText('photo')" onclick="event.stopPropagation()">
                <div class="results-list" id="results-photo"></div>
            </div>
        </div>

        <!-- VIDEO -->
        <div class="card" id="card-video" onclick="openCard('video')">
            <div class="card-title">🎥 Video Search</div>
            <div class="card-content" id="content-video">
                <input type="text" id="input-video" placeholder="Название или ссылка на видео..." oninput="searchItunes('video')" onclick="event.stopPropagation()">
                <div class="status" id="status-video">Поиск...</div>
                <div class="results-list" id="results-video"></div>
            </div>
        </div>

        <!-- AUDIO -->
        <div class="card" id="card-audio" onclick="openCard('audio')">
            <div class="card-title">🎧 Extract Audio</div>
            <div class="card-content" id="content-audio">
                <input type="text" id="input-audio" placeholder="Вставьте ссылку на видео..." oninput="handleDirectLink('audio')" onclick="event.stopPropagation()">
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let activeType = null;
        let searchTimeout = null;

        function openCard(type) {
            if (activeType) return;
            activeType = type;
            ['music', 'photo', 'video', 'audio'].forEach(t => {
                if (t !== type) document.getElementById(`card-${t}`).style.display = 'none';
            });
            document.getElementById(`content-${type}`).style.display = 'block';
            document.getElementById('backBtn').style.display = 'block';
        }

        function resetMenu() {
            ['music', 'photo', 'video', 'audio'].forEach(t => {
                document.getElementById(`card-${t}`).style.display = 'block';
                document.getElementById(`content-${t}`).style.display = 'none';
                const input = document.getElementById(`input-${t}`);
                if (input) input.value = '';
                const res = document.getElementById(`results-${t}`);
                if (res) res.innerHTML = '';
                const st = document.getElementById(`status-${t}`);
                if (st) st.style.display = 'none';
            });
            document.getElementById('backBtn').style.display = 'none';
            activeType = null;
        }

        function searchItunes(type) {
            clearTimeout(searchTimeout);
            const query = document.getElementById(`input-${type}`).value.trim();
            const resBox = document.getElementById(`results-${type}`);
            const status = document.getElementById(`status-${type}`);

            if (!query) {
                resBox.innerHTML = '';
                status.style.display = 'none';
                return;
            }

            if (query.startsWith('http://') || query.startsWith('https://')) {
                sendToBot(type, query);
                return;
            }

            status.innerText = "Ищем...";
            status.style.display = 'block';

            searchTimeout = setTimeout(() => {
                const entity = type === 'video' ? 'musicVideo' : 'song';
                fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=${entity}&limit=10`)
                    .then(res => res.json())
                    .then(data => {
                        status.style.display = 'none';
                        let html = '';
                        if (data.results && data.results.length > 0) {
                            data.results.forEach(item => {
                                const title = item.trackName || query;
                                const artist = item.artistName || 'Artist';
                                const cover = item.artworkUrl100 || 'https://via.placeholder.com/100';
                                const fullQuery = `${artist} - ${title}`;

                                html += `
                                    <div class="track-item" onclick="sendToBot('${type}', '${escapeQuotes(fullQuery)}')">
                                        <div class="track-left">
                                            <img class="track-cover" src="${cover}" alt="cover">
                                            <div class="track-info">
                                                <div class="track-title">${escapeHtml(title)}</div>
                                                <div class="track-artist">${escapeHtml(artist)}</div>
                                            </div>
                                        </div>
                                    </div>
                                `;
                            });
                        }
                        html += `<div class="track-item" onclick="sendToBot('${type}', '${escapeQuotes(query)}')"><div class="track-title">📥 Скачать: "${escapeHtml(query)}"</div></div>`;
                        resBox.innerHTML = html;
                    })
                    .catch(() => {
                        status.style.display = 'none';
                        resBox.innerHTML = `<div class="track-item" onclick="sendToBot('${type}', '${escapeQuotes(query)}')"><div class="track-title">📥 Скачать: "${escapeHtml(query)}"</div></div>`;
                    });
            }, 300);
        }

        function handleDirectText(type) {
            clearTimeout(searchTimeout);
            const query = document.getElementById(`input-${type}`).value.trim();
            const resBox = document.getElementById(`results-${type}`);
            if (!query) {
                resBox.innerHTML = '';
                return;
            }
            resBox.innerHTML = `<div class="track-item" onclick="sendToBot('${type}', '${escapeQuotes(query)}')"><div class="track-title">🔍 Найти: "${escapeHtml(query)}"</div></div>`;
        }

        function handleDirectLink(type) {
            clearTimeout(searchTimeout);
            const val = document.getElementById(`input-${type}`).value.trim();
            if (val.startsWith('http://') || val.startsWith('https://')) {
                searchTimeout = setTimeout(() => {
                    sendToBot(type, val);
                }, 300);
            }
        }

        // Отправка без закрытия WebApp с показом анимации
        function sendToBot(type, queryText) {
            const loader = document.getElementById('loader');
            const toast = document.getElementById('toast');
            
            loader.style.display = 'block';
            toast.style.display = 'block';

            const userChatId = tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : null;

            if (userChatId) {
                // Прямой фоновый запрос на бота
                fetch('http://localhost:8080/api/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: userChatId,
                        type: type,
                        query: queryText
                    })
                }).then(() => {
                    setTimeout(() => {
                        loader.style.display = 'none';
                        toast.innerText = "✅ Запрос отправлен! Файл загружается в чат.";
                        setTimeout(() => { toast.style.display = 'none'; }, 2500);
                    }, 1000);
                }).catch(() => {
                    // Резервный вариант, если локальный сервер недоступен
                    tg.sendData(JSON.stringify({ type: type, query: queryText }));
                });
            } else {
                tg.sendData(JSON.stringify({ type: type, query: queryText }));
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        function escapeQuotes(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '\\"');
        }
    </script>
</body>
</html>
