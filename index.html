<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiwifyx / Control Panel</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace, sans-serif;
    }

    body {
      background-color: #0d0d0d;
      color: #e0e0e0;
      padding: 15px;
    }

    .header {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #ffffff;
      border-bottom: 1px solid #222;
      padding-bottom: 8px;
    }

    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      background: #1a1a1a;
      color: #fff;
      border: 1px solid #333;
      padding: 10px 15px;
      cursor: pointer;
      border-radius: 4px;
      flex: 1;
      text-align: center;
    }

    .tab-btn.active {
      background: #2a2a2a;
      border-color: #555;
    }

    .panel {
      display: none;
      background: #141414;
      border: 1px solid #262626;
      border-radius: 6px;
      padding: 15px;
    }

    .panel.active {
      display: block;
    }

    /* Поля ввода и элементы управления */
    input[type="text"], select {
      width: 100%;
      padding: 10px;
      background: #080808;
      border: 1px solid #333;
      color: #fff;
      border-radius: 4px;
      margin-bottom: 12px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #555;
    }

    .btn-submit {
      width: 100%;
      padding: 10px;
      background: #2b2b2b;
      color: #fff;
      border: 1px solid #444;
      cursor: pointer;
      font-weight: bold;
      border-radius: 4px;
    }

    .btn-submit:hover {
      background: #3a3a3a;
    }

    /* Список результатов поиска */
    .results-list {
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 380px;
      overflow-y: auto;
    }

    .track-item {
      display: flex;
      align-items: center;
      background: #181818;
      border: 1px solid #282828;
      padding: 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .track-item:hover {
      border-color: #444;
      background: #202020;
    }

    .track-cover {
      width: 48px;
      height: 48px;
      border-radius: 4px;
      background: #222;
      margin-right: 12px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .track-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .track-title {
      font-size: 14px;
      font-weight: bold;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 12px;
      color: #888;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .no-results {
      padding: 12px;
      color: #666;
      font-size: 12px;
      text-align: center;
    }

    .layout-video {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .layout-video-bottom {
      display: flex;
      gap: 10px;
    }
  </style>
</head>
<body>

  <div class="header">Kiwifyx / Control Panel</div>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="openTab('video', this)">Video Download</button>
    <button class="tab-btn" onclick="openTab('music', this)">Music Download</button>
  </div>

  <!-- Вкладка VIDEO DOWNLOAD -->
  <div id="video" class="panel active">
    <div class="layout-video">
      <input type="text" id="video-url" placeholder="Вставьте ссылку на YouTube...">
      <div class="layout-video-bottom">
        <select id="video-quality" style="flex: 2;">
          <option value="1080p">1080p Quality</option>
          <option value="720p">720p Quality</option>
          <option value="480p">480p Quality</option>
          <option value="audio">Только звук (MP3)</option>
        </select>
        <button class="btn-submit" style="flex: 1;" onclick="sendVideoRequest()">Скачать</button>
      </div>
    </div>
  </div>

  <!-- Вкладка MUSIC DOWNLOAD -->
  <div id="music" class="panel">
    <input type="text" id="music-search" placeholder="Поиск песни (название / артист)..." oninput="searchMusic(this.value)">
    
    <div class="results-list" id="music-results">
      <!-- Результаты рендерятся динамически через JS -->
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Предустановленная база треков с качественными обложками
    const defaultTracks = [
      { title: "Throw Away Your Mask", artist: "Lyn", img: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=100&h=100&fit=crop" },
      { title: "Linear", artist: "Chinese Cigarettes", img: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=100&h=100&fit=crop" },
      { title: "Call Girl Life", artist: "Miraidempa", img: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=100&h=100&fit=crop" },
      { title: "Disparate Youth", artist: "Santigold", img: "https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=100&h=100&fit=crop" },
      { title: "tesla - slowed electro mix", artist: "Fixupboy", img: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=100&h=100&fit=crop" },
      { title: "Burial", artist: "Yakui The Maid", img: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=100&h=100&fit=crop" },
      { title: "Clear Eyes", artist: "Aidan Swank", img: "https://images.unsplash.com/photo-1501386761578-eac5c94b800a?w=100&h=100&fit=crop" }
    ];

    function openTab(tabName, element) {
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      
      document.getElementById(tabName).classList.add('active');
      element.classList.add('active');
    }

    function renderTrackList(tracks) {
      const container = document.getElementById('music-results');
      if (tracks.length === 0) {
        container.innerHTML = `<div class="no-results">Ничего не найдено</div>`;
        return;
      }

      container.innerHTML = tracks.map(t => `
        <div class="track-item" onclick="sendMusicRequest('${t.title} - ${t.artist}')">
          <img class="track-cover" src="${t.img}" alt="cover" onerror="this.src='https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=100&h=100&fit=crop'">
          <div class="track-info">
            <div class="track-title">${t.title}</div>
            <div class="track-artist">${t.artist}</div>
          </div>
        </div>
      `).join('');
    }

    function searchMusic(val) {
      const query = val.trim().toLowerCase();
      
      if (!query) {
        renderTrackList(defaultTracks);
        return;
      }

      // Находим совпадения из нашей базы
      const matched = defaultTracks.filter(t => 
        t.title.toLowerCase().includes(query) || 
        t.artist.toLowerCase().includes(query)
      );

      // Генерируем варианты под введенное название (оригинал, slowed, remix и т.д.)
      const dynamicResults = [
        ...matched,
        { title: val, artist: "Скачать оригинал", img: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=100&h=100&fit=crop" },
        { title: `${val} (Slowed + Reverb)`, artist: "Похожий вариант", img: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=100&h=100&fit=crop" },
        { title: `${val} (Sped Up)`, artist: "Ускоренная версия", img: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=100&h=100&fit=crop" }
      ];

      renderTrackList(dynamicResults);
    }

    function sendVideoRequest() {
      const url = document.getElementById('video-url').value;
      const quality = document.getElementById('video-quality').value;
      if (!url) return alert('Введите ссылку!');
      
      const mode = quality === 'audio' ? 'audio' : 'video';
      tg.sendData(`${mode}|||${url}|||${quality}`);
      tg.close();
    }

    function sendMusicRequest(query) {
      tg.sendData(`audio|||${query}|||best`);
      tg.close();
    }

    // Инициализация стартового списка при загрузке
    renderTrackList(defaultTracks);
  </script>
</body>
</html>
