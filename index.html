<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiwifyx</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #181818;
            --hover-bg: #282828;
            --input-bg: #0f0f0f;
            --border-color: #2a2a2a;
            --text-main: #e1e1e1;
            --text-sub: #888888;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Consolas, "Courier New", monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            max-width: 500px;
            text-align: left;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 12px;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .back-btn {
            display: none;
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            font-size: 12px;
            cursor: pointer;
            margin-bottom: 10px;
            text-align: left;
        }

        .back-btn:hover {
            background: var(--hover-bg);
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 10px;
            cursor: pointer;
        }

        .card-title {
            font-size: 13px;
            font-weight: bold;
            color: var(--text-main);
        }

        .card-content {
            display: none;
            margin-top: 10px;
        }

        input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 8px 10px;
            color: var(--text-main);
            font-size: 12px;
            outline: none;
        }

        .results-list {
            margin-top: 8px;
            max-height: 380px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .track-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 6px 8px;
            cursor: pointer;
            gap: 10px;
        }

        .track-item:hover {
            background: var(--hover-bg);
        }

        .track-left {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }

        .track-cover {
            width: 42px;
            height: 42px;
            border-radius: 4px;
            object-fit: cover;
            background: #222;
            flex-shrink: 0;
        }

        .track-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .track-title {
            font-size: 12px;
            font-weight: bold;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 11px;
            color: var(--text-sub);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

    <div class="header">Kiwifyx / Search</div>

    <button class="back-btn" id="backBtn" onclick="resetMenu()">&lt; Back to Menu</button>

    <div class="container">
        
        <!-- MUSIC -->
        <div class="card" id="card-music" onclick="openCard('music')">
            <div class="card-title">Music Search</div>
            <div class="card-content" id="content-music">
                <input type="text" id="input-music" placeholder="Track or artist name..." oninput="liveSearch('music')" onclick="event.stopPropagation()">
                <div class="results-list" id="results-music"></div>
            </div>
        </div>

        <!-- PHOTO -->
        <div class="card" id="card-photo" onclick="openCard('photo')">
            <div class="card-title">Photo Search</div>
            <div class="card-content" id="content-photo">
                <input type="text" id="input-photo" placeholder="Search image title..." oninput="liveSearch('photo')" onclick="event.stopPropagation()">
                <div class="results-list" id="results-photo"></div>
            </div>
        </div>

        <!-- VIDEO -->
        <div class="card" id="card-video" onclick="openCard('video')">
            <div class="card-title">Video Search & Download</div>
            <div class="card-content" id="content-video">
                <input type="text" id="input-video" placeholder="Video name or link..." oninput="liveSearch('video')" onclick="event.stopPropagation()">
                <div class="results-list" id="results-video"></div>
            </div>
        </div>

        <!-- AUDIO -->
        <div class="card" id="card-audio" onclick="openCard('audio')">
            <div class="card-title">Audio Extract</div>
            <div class="card-content" id="content-audio">
                <input type="text" id="input-audio" placeholder="Paste video link..." oninput="handleDirectLink('audio')" onclick="event.stopPropagation()">
            </div>
        </div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let activeType = null;
        let searchTimeout = null;

        function openCard(type) {
            if (activeType) return;
            activeType = type;
            ['music', 'photo', 'video', 'audio'].forEach(t => {
                if (t !== type) document.getElementById(`card-${t}`).style.display = 'none';
            });
            document.getElementById(`content-${type}`).style.display = 'block';
            document.getElementById('backBtn').style.display = 'block';
        }

        function resetMenu() {
            ['music', 'photo', 'video', 'audio'].forEach(t => {
                document.getElementById(`card-${t}`).style.display = 'block';
                document.getElementById(`content-${t}`).style.display = 'none';
                const input = document.getElementById(`input-${t}`);
                if (input) input.value = '';
                const res = document.getElementById(`results-${t}`);
                if (res) res.innerHTML = '';
            });
            document.getElementById('backBtn').style.display = 'none';
            activeType = null;
        }

        function liveSearch(type) {
            clearTimeout(searchTimeout);
            const query = document.getElementById(`input-${type}`).value.trim();
            const resBox = document.getElementById(`results-${type}`);

            if (!query) {
                resBox.innerHTML = '';
                return;
            }

            if (query.startsWith('http://') || query.startsWith('https://')) {
                sendToBot(type, query);
                return;
            }

            searchTimeout = setTimeout(() => {
                let items = [];
                if (type === 'music') {
                    items = [
                        { title: query, artist: "Original Version", cover: "https://picsum.photos/seed/" + encodeURIComponent(query + "1") + "/200/200" },
                        { title: `${query} (Slowed + Reverb)`, artist: "Lo-Fi Remix", cover: "https://picsum.photos/seed/" + encodeURIComponent(query + "2") + "/200/200" },
                        { title: `${query} (Speed Up)`, artist: "TikTok Version", cover: "https://picsum.photos/seed/" + encodeURIComponent(query + "3") + "/200/200" },
                        { title: `${query} (Sped Up)`, artist: "Nightcore Mix", cover: "https://picsum.photos/seed/" + encodeURIComponent(query + "4") + "/200/200" }
                    ];
                } else if (type === 'video') {
                    items = [
                        { title: `${query} - Official Video`, artist: "YouTube HD", cover: "https://picsum.photos/seed/" + encodeURIComponent(query + "v1") + "/200/200" },
                        { title: `${query} - Music Video`, artist: "4K Clip", cover: "https://picsum.photos/seed/" + encodeURIComponent(query + "v2") + "/200/200" }
                    ];
                } else if (type === 'photo') {
                    items = [
                        { title: `${query} Aesthetic`, artist: "Pinterest Art", cover: "https://picsum.photos/seed/" + encodeURIComponent(query + "p1") + "/200/200" },
                        { title: `${query} Wallpaper`, artist: "HD Background", cover: "https://picsum.photos/seed/" + encodeURIComponent(query + "p2") + "/200/200" }
                    ];
                }

                let html = '';
                items.forEach(item => {
                    const sendVal = `${item.artist} - ${item.title}`;
                    html += `
                        <div class="track-item" onclick="sendToBot('${type}', '${escapeQuotes(sendVal)}')">
                            <div class="track-left">
                                <img class="track-cover" src="${item.cover}" alt="cover">
                                <div class="track-info">
                                    <div class="track-title">${escapeHtml(item.title)}</div>
                                    <div class="track-artist">${escapeHtml(item.artist)}</div>
                                </div>
                            </div>
                        </div>
                    `;
                });
                resBox.innerHTML = html;
            }, 100);
        }

        function handleDirectLink(type) {
            clearTimeout(searchTimeout);
            const val = document.getElementById(`input-${type}`).value.trim();
            if (val.startsWith('http://') || val.startsWith('https://')) {
                searchTimeout = setTimeout(() => {
                    sendToBot(type, val);
                }, 300);
            }
        }

        function sendToBot(type, queryText) {
            try {
                tg.sendData(JSON.stringify({ type: type, query: queryText }));
                setTimeout(() => { tg.close(); }, 100);
            } catch (e) {
                alert("Launch inside Telegram bot");
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        function escapeQuotes(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '\\"');
        }
    </script>
</body>
</html>
