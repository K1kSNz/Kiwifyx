<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@KiwifyxBot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2c;
            --accent-color: #2563eb;
            --text-color: #ffffff;
            --border-color: #2a3447;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            border-radius: 0 !important; /* Убираем скругления */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            max-width: 400px;
            text-align: center;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 20px;
            color: #94a3b8;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .back-btn {
            display: none;
            width: 100%;
            max-width: 400px;
            background: transparent;
            color: #94a3b8;
            border: 1px solid var(--border-color);
            padding: 8px;
            font-size: 12px;
            cursor: pointer;
            margin-bottom: 15px;
            text-align: left;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 12px;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-img {
            width: 45px;
            height: 45px;
            object-fit: cover;
            background: #1e293b;
            border: 1px solid var(--border-color);
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-content {
            display: none;
            margin-top: 15px;
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        input {
            flex: 1;
            background: #0f172a;
            border: 1px solid var(--border-color);
            padding: 10px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        button.action-btn {
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .results-list {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .result-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0f172a;
            border: 1px solid var(--border-color);
            padding: 8px;
        }

        .result-info {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }

        .result-img {
            width: 35px;
            height: 35px;
            object-fit: cover;
            background: #1e293b;
        }

        .result-text {
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
        }

        .download-btn {
            background: #10b981;
            color: #fff;
            border: none;
            padding: 6px 10px;
            font-size: 11px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">@KiwifyxBot</div>

    <button class="back-btn" id="backBtn" onclick="resetMenu()">← НАЗАД К МЕНЮ</button>

    <div class="container" id="cardsContainer">
        
        <!-- Карточка 1: Музыка -->
        <div class="card" id="card-music" onclick="openCard('music')">
            <div class="card-header">
                <!-- Замените src на свою картинку -->
                <img src="https://via.placeholder.com/45/2563eb/ffffff?text=MUSIC" class="card-img" alt="img">
                <div class="card-title">🎵 Поиск музыки</div>
            </div>
            <div class="card-content" id="content-music">
                <div class="input-group">
                    <input type="text" id="input-music" placeholder="Введите название..." onclick="event.stopPropagation()">
                    <button class="action-btn" onclick="searchMusic(event)">ИСКАТЬ</button>
                </div>
                <div class="results-list" id="results-music"></div>
            </div>
        </div>

        <!-- Карточка 2: Pinterest -->
        <div class="card" id="card-pinterest" onclick="openCard('pinterest')">
            <div class="card-header">
                <!-- Замените src на свою картинку -->
                <img src="https://via.placeholder.com/45/e11d48/ffffff?text=PIN" class="card-img" alt="img">
                <div class="card-title">📌 Pinterest фото</div>
            </div>
            <div class="card-content" id="content-pinterest">
                <div class="input-group">
                    <input type="text" id="input-pinterest" placeholder="Эстетический запрос..." onclick="event.stopPropagation()">
                    <button class="action-btn" onclick="sendDirect('pinterest', 'input-pinterest', event)">НАЙТИ</button>
                </div>
            </div>
        </div>

        <!-- Карточка 3: Видео -->
        <div class="card" id="card-video" onclick="openCard('video')">
            <div class="card-header">
                <!-- Замените src на свою картинку -->
                <img src="https://via.placeholder.com/45/0284c7/ffffff?text=VIDEO" class="card-img" alt="img">
                <div class="card-title">🎬 Скачать видео</div>
            </div>
            <div class="card-content" id="content-video">
                <div class="input-group">
                    <input type="text" id="input-video" placeholder="Ссылка на видео..." onclick="event.stopPropagation()">
                    <button class="action-btn" onclick="sendDirect('video', 'input-video', event)">СКАЧАТЬ</button>
                </div>
            </div>
        </div>

        <!-- Карточка 4: Аудио -->
        <div class="card" id="card-audio" onclick="openCard('audio')">
            <div class="card-header">
                <!-- Замените src на свою картинку -->
                <img src="https://via.placeholder.com/45/d97706/ffffff?text=AUDIO" class="card-img" alt="img">
                <div class="card-title">🎧 Вырезать аудио</div>
            </div>
            <div class="card-content" id="content-audio">
                <div class="input-group">
                    <input type="text" id="input-audio" placeholder="Ссылка на видео..." onclick="event.stopPropagation()">
                    <button class="action-btn" onclick="sendDirect('audio', 'input-audio', event)">ИЗВЛЕЧЬ</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let activeCardId = null;

        function openCard(type) {
            if (activeCardId) return;

            activeCardId = type;
            const cards = ['music', 'pinterest', 'video', 'audio'];

            cards.forEach(c => {
                if (c !== type) {
                    document.getElementById(`card-${c}`).style.display = 'none';
                }
            });

            const activeCard = document.getElementById(`card-${type}`);
            const content = document.getElementById(`content-${type}`);

            content.style.display = 'block';
            document.getElementById('backBtn').style.display = 'block';
        }

        function resetMenu() {
            const cards = ['music', 'pinterest', 'video', 'audio'];
            cards.forEach(c => {
                document.getElementById(`card-${c}`).style.display = 'block';
                document.getElementById(`content-${c}`).style.display = 'none';
            });

            document.getElementById('backBtn').style.display = 'none';
            document.getElementById('results-music').innerHTML = '';
            activeCardId = null;
        }

        // Поиск музыки (показывает 3 похожих результата с картинками)
        function searchMusic(event) {
            event.stopPropagation();
            const query = document.getElementById('input-music').value.trim();
            if (!query) return;

            const resultsContainer = document.getElementById('results-music');
            resultsContainer.innerHTML = '<div style="font-size: 12px; color: #94a3b8;">Поиск...</div>';

            // Имитация вариантов с превью (при отправке передаст текст боту)
            setTimeout(() => {
                resultsContainer.innerHTML = `
                    <div class="result-item">
                        <div class="result-info">
                            <img src="https://via.placeholder.com/35/2563eb/ffffff?text=1" class="result-img">
                            <div class="result-text">${query} (Original Mix)</div>
                        </div>
                        <button class="download-btn" onclick="sendToBot('music', '${query}', event)">СКАЧАТЬ</button>
                    </div>
                    <div class="result-item">
                        <div class="result-info">
                            <img src="https://via.placeholder.com/35/2563eb/ffffff?text=2" class="result-img">
                            <div class="result-text">${query} (Remix)</div>
                        </div>
                        <button class="download-btn" onclick="sendToBot('music', '${query} remix', event)">СКАЧАТЬ</button>
                    </div>
                    <div class="result-item">
                        <div class="result-info">
                            <img src="https://via.placeholder.com/35/2563eb/ffffff?text=3" class="result-img">
                            <div class="result-text">${query} (Speed Up)</div>
                        </div>
                        <button class="download-btn" onclick="sendToBot('music', '${query} speed up', event)">СКАЧАТЬ</button>
                    </div>
                `;
            }, 400);
        }

        function sendDirect(type, inputId, event) {
            event.stopPropagation();
            const val = document.getElementById(inputId).value.trim();
            if (!val) return;
            sendToBot(type, val, event);
        }

        // Отправка данных боту в сообщения
        function sendToBot(type, queryText, event) {
            event.stopPropagation();
            tg.sendData(JSON.stringify({ type: type, query: queryText }));
            tg.close();
        }
    </script>
</body>
</html>
