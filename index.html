<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiwifyx / Control Panel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d0d;
            --surface: #141414;
            --surface-2: #1e1e1e;
            --line: #2a2a2a;
            --text: #eae8f0;
            --muted: #8b8a99;
            --accent: #ffb454;
            --accent-dim: #6a5a33;
            --violet: #7c6cf0;
            --tag: #93a6c9;
            --cyan: #8fe0ea;
            --radius: 14px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            padding: 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #ffffff;
            border-bottom: 1px solid var(--line);
            padding-bottom: 8px;
            font-family: 'IBM Plex Mono', monospace;
        }
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 5px; }
        .tab-btn {
            background: #1a1a1a;
            color: #fff;
            border: 1px solid #333;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 8px;
            flex: 1;
            text-align: center;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 14px;
            transition: background .16s, border-color .16s;
        }
        .tab-btn:hover { background: #232323; border-color: #444; }
        .tab-btn.active { background: #2a2a2a; border-color: #555; font-weight: 700; }
        
        .panel { display: none; flex-direction: column; gap: 12px; }
        .panel.active { display: flex; }

        input[type="text"], select {
            width: 100%;
            padding: 12px 14px;
            background: #101014;
            border: 1px solid #2c2c34;
            color: var(--cyan);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 14px;
            border-radius: 10px;
            outline: none;
            transition: border-color .2s, background .2s;
        }
        input[type="text"]::placeholder { color: #55565f; }
        input[type="text"]:focus { border-color: #454550; background: #131317; }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #2b2b2b;
            color: #fff;
            border: 1px solid #444;
            cursor: pointer;
            font-weight: bold;
            border-radius: 10px;
            font-family: 'Space Grotesk', sans-serif;
            transition: background .2s;
        }
        .btn-submit:hover { background: #3a3a3a; }

        /* Results & Track styles */
        .results-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 480px;
            overflow-y: auto;
            margin-top: 5px;
        }
        .status-msg {
            padding: 30px 10px;
            color: var(--muted);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            text-align: center;
        }
        .track-item {
            display: flex;
            align-items: center;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 9px;
            cursor: pointer;
            transition: border-color .2s, background .2s;
        }
        .track-item:hover { border-color: #3a3a47; background: var(--surface-2); }
        .track-item.playing { border-color: var(--accent); background: #201b12; }

        .cover-wrap {
            position: relative;
            flex: none;
            width: 48px;
            height: 48px;
            border-radius: 8px;
            overflow: hidden;
            background: var(--surface-2);
        }
        .cover-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .play-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,.45);
            opacity: 0;
            transition: opacity .15s;
        }
        .track-item:hover .play-overlay { opacity: 1; }
        .track-item.playing .play-overlay { opacity: 1; background: rgba(0,0,0,.35); }
        .play-overlay svg { width: 18px; height: 18px; fill: #fff; }

        .track-info { flex: 1; min-width: 0; margin-left: 10px; }
        .track-title { font-size: 14px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-artist { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .track-meta { flex: none; display: flex; align-items: center; gap: 6px; }
        .action-btn {
            width: 32px; height: 32px;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            background: var(--surface-2);
            border: 1px solid var(--line);
            color: var(--muted);
            cursor: pointer;
            text-decoration: none;
            transition: all .15s;
        }
        .action-btn:hover { color: var(--text); border-color: var(--accent); }
        .action-btn svg { width: 14px; height: 14px; }
        .download-btn:hover { color: #2ea44f; border-color: #2ea44f; background: #112218; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">Kiwifyx / Control Panel</div>

        <div class="nav-tabs">
            <button class="tab-btn active" onclick="openTab('video', this)">Video Download</button>
            <button class="tab-btn" onclick="openTab('music', this)">Music Download</button>
        </div>

        <!-- VIDEO PANEL -->
        <div id="video" class="panel active">
            <input type="text" id="video-url" placeholder="Вставьте ссылку на видео (YouTube, TikTok)...">
            <div style="display: flex; gap: 10px;">
                <select id="video-quality" style="flex: 2;">
                    <option value="1080p">1080p Quality</option>
                    <option value="720p">720p Quality</option>
                    <option value="480p">480p Quality</option>
                    <option value="audio">Только звук (MP3)</option>
                </select>
                <button class="btn-submit" style="flex: 1;" onclick="sendVideoRequest()">Скачать</button>
            </div>
        </div>

        <!-- MUSIC PANEL -->
        <div id="music" class="panel">
            <input type="text" id="music-search" placeholder="Ссылка или название песни..." oninput="handleSearchInput(this.value)">
            <div class="results-list" id="music-results">
                <div class="status-msg">Введите название песни или ссылку</div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let searchTimeout = null;
        let audio = null;
        let currentTrackId = null;

        function openTab(tabName, element) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            element.classList.add('active');
            if (audio) { audio.pause(); }
        }

        function handleSearchInput(value) {
            clearTimeout(searchTimeout);
            const query = value.trim();
            const container = document.getElementById('music-results');

            if (!query) {
                container.innerHTML = `<div class="status-msg">Введите название песни или ссылку</div>`;
                return;
            }

            if (query.startsWith('http://') || query.startsWith('https://')) {
                container.innerHTML = `
                    <button class="btn-submit" style="background: #1db954; border-color: #1ed760;" onclick="sendMusicRequest('${escapeQuotes(query)}')">
                        🎧 Скачать по ссылке через бота
                    </button>`;
                return;
            }

            container.innerHTML = `<div class="status-msg">Поиск...</div>`;

            searchTimeout = setTimeout(() => {
                searchTracks(query);
            }, 300);
        }

        function searchTracks(query) {
            const container = document.getElementById('music-results');
            const script = document.createElement('script');
            const callbackName = 'deezerCallback_' + Math.round(100000 * Math.random());
            
            window[callbackName] = function(data) {
                delete window[callbackName];
                document.body.removeChild(script);

                if (!data.data || data.data.length === 0) {
                    container.innerHTML = `<div class="status-msg">Ничего не найдено</div>`;
                    return;
                }

                container.innerHTML = data.data.map(track => {
                    const fullTitle = `${track.artist.name} - ${track.title}`;
                    return `
                        <div class="track-item" onclick="togglePreview(this, '${track.preview}', '${escapeQuotes(track.title)}', '${escapeQuotes(track.artist.name)}', ${track.id})">
                            <div class="cover-wrap">
                                <img src="${track.album.cover_medium}" alt="cover">
                                ${track.preview ? `<div class="play-overlay"><svg viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20"></polygon></svg></div>` : ''}
                            </div>
                            <div class="track-info">
                                <div class="track-title">${escapeHtml(track.title)}</div>
                                <div class="track-artist">${escapeHtml(track.artist.name)}</div>
                            </div>
                            <div class="track-meta" onclick="event.stopPropagation()">
                                <button class="action-btn download-btn" title="Скачать через бота" onclick="sendMusicRequest('${escapeQuotes(fullTitle)}')">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                                </button>
                                <a class="action-btn" href="${track.link}" target="_blank" title="Открыть в Deezer">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                                </a>
                            </div>
                        </div>
                    `;
                }).join('');
            };

            script.src = `https://api.deezer.com/search?q=${encodeURIComponent(query)}&limit=12&output=jsonp&callback=${callbackName}`;
            document.body.appendChild(script);
        }

        function togglePreview(el, url, title, artist, id) {
            if (!url) return;
            
            if (currentTrackId === id && audio) {
                if (audio.paused) { audio.play(); el.classList.add('playing'); } 
                else { audio.pause(); el.classList.remove('playing'); }
                return;
            }

            if (audio) { 
                audio.pause(); 
                document.querySelectorAll('.track-item').forEach(t => t.classList.remove('playing'));
            }

            audio = new Audio(url);
            currentTrackId = id;
            el.classList.add('playing');
            audio.play();

            audio.addEventListener('ended', () => {
                el.classList.remove('playing');
                currentTrackId = null;
            });
        }

        function sendVideoRequest() {
            const url = document.getElementById('video-url').value.trim();
            const quality = document.getElementById('video-quality').value;
            if (!url) return alert('Введите ссылку!');
            
            const mode = quality === 'audio' ? 'audio' : 'video';
            tg.sendData(`${mode}|||${url}|||${quality}`);
            tg.close();
        }

        function sendMusicRequest(query) {
            tg.sendData(`audio|||${query}|||best`);
            tg.close();
        }

        function escapeHtml(str) {
            return String(str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function escapeQuotes(str) {
            return String(str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
