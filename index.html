<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiwifyx WebApp</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0d0d0d;
      color: #ffffff;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .card {
      background-color: #000000;
      border: 1px solid #1a1a1a;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 500;
      color: #cccccc;
      text-align: center;
    }

    /* Общий стиль белых элементов/кнопок */
    .white-box, .input-box {
      background-color: #ffffff;
      border-radius: 6px;
      border: none;
      outline: none;
    }

    /* 1. Секция MENU (2 квадратные кнопки в ряд) */
    .menu-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .menu-btn {
      aspect-ratio: 1 / 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #000;
      transition: transform 0.1s ease;
    }

    .menu-btn:active {
      transform: scale(0.96);
    }

    /* 2. Секция VIDEO DOWNLOAD */
    .input-full {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      font-size: 14px;
      color: #000;
    }

    .video-content-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .large-preview-box {
      height: 160px;
    }

    .video-actions {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .btn-small {
      height: 48px;
      width: 100%;
      cursor: pointer;
      font-weight: bold;
      color: #000;
    }

    /* 3. Секция MUSIC DOWNLOAD */
    .music-container {
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body>

  <!-- 1. MENU SECTION -->
  <div class="card">
    <div class="card-title">menu</div>
    <div class="menu-grid">
      <button class="white-box menu-btn" onclick="sendData('/photo cat')">Photo</button>
      <button class="white-box menu-btn" onclick="alert('Menu 2')">Option</button>
    </div>
  </div>

  <!-- 2. VIDEO DOWNLOAD SECTION -->
  <div class="card">
    <div class="card-title">video download</div>
    <input type="text" id="videoUrl" class="input-box input-full" placeholder="Вставьте ссылку на видео...">
    
    <div class="video-content-grid">
      <div class="white-box large-preview-box"></div>
      <div class="video-actions">
        <button class="white-box btn-small" onclick="downloadVideo()">Скачать</button>
      </div>
    </div>
  </div>

  <!-- 3. MUSIC DOWNLOAD SECTION -->
  <div class="card">
    <div class="card-title">music dowload</div>
    <div class="music-container">
      <input type="text" id="musicQuery" class="input-box input-full" placeholder="Введите название или ссылку..." onchange="downloadMusic()">
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Функция отправки данных в Telegram бота
    function sendData(data) {
      tg.sendData(data);
    }

    function downloadVideo() {
      const url = document.getElementById('videoUrl').value;
      if (url) {
        sendData(`/video 1080p ${url}`);
      }
    }

    function downloadMusic() {
      const query = document.getElementById('musicQuery').value;
      if (query) {
        sendData(`/music ${query}`);
      }
    }
  </script>
</body>
</html>
