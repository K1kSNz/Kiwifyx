<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiwifyx / Control Panel</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace, sans-serif;
    }

    body {
      background-color: #0d0d0d;
      color: #e0e0e0;
      padding: 15px;
    }

    .header {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #ffffff;
      border-bottom: 1px solid #222;
      padding-bottom: 8px;
    }

    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      background: #1a1a1a;
      color: #fff;
      border: 1px solid #333;
      padding: 10px 15px;
      cursor: pointer;
      border-radius: 4px;
      flex: 1;
      text-align: center;
    }

    .tab-btn.active {
      background: #2a2a2a;
      border-color: #555;
    }

    .panel {
      display: none;
      background: #141414;
      border: 1px solid #262626;
      border-radius: 6px;
      padding: 15px;
    }

    .panel.active {
      display: block;
    }

    /* Поля ввода и форматы */
    input[type="text"], select {
      width: 100%;
      padding: 10px;
      background: #080808;
      border: 1px solid #333;
      color: #fff;
      border-radius: 4px;
      margin-bottom: 12px;
    }

    .btn-submit {
      width: 100%;
      padding: 10px;
      background: #2b2b2b;
      color: #fff;
      border: 1px solid #444;
      cursor: pointer;
      font-weight: bold;
      border-radius: 4px;
    }

    .btn-submit:hover {
      background: #3a3a3a;
    }

    /* Список результатов поиска */
    .results-list {
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .track-item {
      display: flex;
      align-items: center;
      background: #181818;
      border: 1px solid #282828;
      padding: 8px;
      border-radius: 4px;
      cursor: pointer;
    }

    .track-item:hover {
      border-color: #444;
      background: #202020;
    }

    .track-cover {
      width: 48px;
      height: 48px;
      border-radius: 4px;
      background: #333;
      margin-right: 12px;
      object-fit: cover;
    }

    .track-info {
      display: flex;
      flex-direction: column;
    }

    .track-title {
      font-size: 14px;
      font-weight: bold;
      color: #ffffff;
    }

    .track-artist {
      font-size: 12px;
      color: #888;
      margin-top: 2px;
    }

    .layout-video {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .layout-video-bottom {
      display: flex;
      gap: 10px;
    }
  </style>
</head>
<body>

  <div class="header">Kiwifyx / Control Panel</div>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="openTab('video', this)">Video Download</button>
    <button class="tab-btn" onclick="openTab('music', this)">Music Download</button>
  </div>

  <!-- Вкладка VIDEO DOWNLOAD -->
  <div id="video" class="panel active">
    <div class="layout-video">
      <input type="text" id="video-url" placeholder="Вставьте ссылку на YouTube...">
      <div class="layout-video-bottom">
        <select id="video-quality" style="flex: 2;">
          <option value="1080p">1080p Quality</option>
          <option value="720p">720p Quality</option>
          <option value="480p">480p Quality</option>
          <option value="audio">Только звук (MP3)</option>
        </select>
        <button class="btn-submit" style="flex: 1;" onclick="sendVideoRequest()">Скачать</button>
      </div>
    </div>
  </div>

  <!-- Вкладка MUSIC DOWNLOAD -->
  <div id="music" class="panel">
    <input type="text" id="music-search" placeholder="Поиск песни (название / Spotify ссылка)..." oninput="searchMusic(this.value)">
    
    <div class="results-list" id="music-results">
      <div class="track-item" onclick="sendMusicRequest('Throw Away Your Mask - Lyn')">
        <img class="track-cover" src="https://via.placeholder.com/48" alt="cover">
        <div class="track-info">
          <div class="track-title">Throw Away Your Mask</div>
          <div class="track-artist">Lyn</div>
        </div>
      </div>
      <div class="track-item" onclick="sendMusicRequest('Linear - Chinese Cigarettes')">
        <img class="track-cover" src="https://via.placeholder.com/48" alt="cover">
        <div class="track-info">
          <div class="track-title">Linear</div>
          <div class="track-artist">Chinese Cigarettes</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    function openTab(tabName, element) {
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      
      document.getElementById(tabName).classList.add('active');
      element.classList.add('active');
    }

    function sendVideoRequest() {
      const url = document.getElementById('video-url').value;
      const quality = document.getElementById('video-quality').value;
      if (!url) return alert('Введите ссылку!');
      
      const mode = quality === 'audio' ? 'audio' : 'video';
      tg.sendData(`${mode}|||${url}|||${quality}`);
      tg.close();
    }

    function sendMusicRequest(query) {
      tg.sendData(`audio|||${query}|||best`);
      tg.close();
    }

    function searchMusic(val) {
      if (!val) return;
      const resultsContainer = document.getElementById('music-results');
      
      resultsContainer.innerHTML = `
        <div class="track-item" onclick="sendMusicRequest('${val}')">
          <img class="track-cover" src="https://via.placeholder.com/48" alt="cover">
          <div class="track-info">
            <div class="track-title">${val}</div>
            <div class="track-artist">Скачать оригинал</div>
          </div>
        </div>
        <div class="track-item" onclick="sendMusicRequest('${val} remix')">
          <img class="track-cover" src="https://via.placeholder.com/48" alt="cover">
          <div class="track-info">
            <div class="track-title">${val} (Remix)</div>
            <div class="track-artist">Похожий трек</div>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
