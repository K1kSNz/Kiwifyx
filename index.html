<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiwifyx</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #181818;
            --hover-bg: #282828;
            --input-bg: #0f0f0f;
            --border-color: #2a2a2a;
            --text-main: #e1e1e1;
            --text-sub: #888888;
            --accent-color: #4a90e2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Consolas, "Courier New", monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            max-width: 500px;
            text-align: left;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .back-btn {
            display: none;
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            font-size: 12px;
            cursor: pointer;
            margin-bottom: 10px;
            text-align: left;
        }

        .back-btn:hover {
            background: var(--hover-bg);
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 10px;
            cursor: pointer;
        }

        .card:hover {
            background: var(--hover-bg);
        }

        .card-title {
            font-size: 13px;
            font-weight: bold;
            color: var(--text-main);
        }

        .card-content {
            display: none;
            margin-top: 10px;
        }

        input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 8px 10px;
            color: var(--text-main);
            font-size: 12px;
            outline: none;
        }

        input:focus {
            border-color: #555;
        }

        .results-list {
            margin-top: 8px;
            max-height: 380px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .results-list::-webkit-scrollbar {
            width: 4px;
        }
        .results-list::-webkit-scrollbar-thumb {
            background: var(--border-color);
        }

        .track-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 6px 8px;
            cursor: pointer;
            gap: 10px;
        }

        .track-item:hover {
            background: var(--card-bg);
        }

        .track-left {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }

        .track-cover {
            width: 42px;
            height: 42px;
            border-radius: 4px;
            object-fit: cover;
            background: #222;
            flex-shrink: 0;
        }

        .track-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .track-title {
            font-size: 12px;
            font-weight: bold;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-title .date-tag {
            color: var(--accent-color);
            font-weight: normal;
        }

        .track-artist {
            font-size: 11px;
            color: var(--text-sub);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status-text {
            font-size: 11px;
            color: var(--text-sub);
            margin-top: 6px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="header">Kiwifyx / Search</div>

    <button class="back-btn" id="backBtn" onclick="resetMenu()">&lt; Back to Menu</button>

    <div class="container">
        
        <!-- MUSIC -->
        <div class="card" id="card-music" onclick="openCard('music')">
            <div class="card-title">Music Search</div>
            <div class="card-content" id="content-music">
                <input type="text" id="input-music" placeholder="Track or artist name..." oninput="searchMusic()" onclick="event.stopPropagation()">
                <div class="status-text" id="status-music">Searching...</div>
                <div class="results-list" id="results-music"></div>
            </div>
        </div>

        <!-- PHOTO -->
        <div class="card" id="card-photo" onclick="openCard('photo')">
            <div class="card-title">Photo Search</div>
            <div class="card-content" id="content-photo">
                <input type="text" id="input-photo" placeholder="Search image..." oninput="searchPhoto()" onclick="event.stopPropagation()">
                <div class="status-text" id="status-photo">Searching...</div>
                <div class="results-list" id="results-photo"></div>
            </div>
        </div>

        <!-- VIDEO -->
        <div class="card" id="card-video" onclick="openCard('video')">
            <div class="card-title">Video Download</div>
            <div class="card-content" id="content-video">
                <input type="text" id="input-video" placeholder="Paste link..." oninput="handleDirectLink('video')" onclick="event.stopPropagation()">
                <div class="status-text" id="status-video">Processing link...</div>
            </div>
        </div>

        <!-- AUDIO -->
        <div class="card" id="card-audio" onclick="openCard('audio')">
            <div class="card-title">Audio Extract</div>
            <div class="card-content" id="content-audio">
                <input type="text" id="input-audio" placeholder="Paste link..." oninput="handleDirectLink('audio')" onclick="event.stopPropagation()">
                <div class="status-text" id="status-audio">Processing link...</div>
            </div>
        </div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let activeType = null;
        let searchTimeout = null;

        function openCard(type) {
            if (activeType) return;
            activeType = type;
            ['music', 'photo', 'video', 'audio'].forEach(t => {
                if (t !== type) document.getElementById(`card-${t}`).style.display = 'none';
            });
            document.getElementById(`content-${type}`).style.display = 'block';
            document.getElementById('backBtn').style.display = 'block';
        }

        function resetMenu() {
            ['music', 'photo', 'video', 'audio'].forEach(t => {
                document.getElementById(`card-${t}`).style.display = 'block';
                document.getElementById(`content-${t}`).style.display = 'none';
                const input = document.getElementById(`input-${t}`);
                if (input) input.value = '';
                const res = document.getElementById(`results-${t}`);
                if (res) res.innerHTML = '';
                const status = document.getElementById(`status-${t}`);
                if (status) status.style.display = 'none';
            });
            document.getElementById('backBtn').style.display = 'none';
            activeType = null;
        }

        // Поиск музыки через открытый API Deezer с настоящими обложками
        function searchMusic() {
            clearTimeout(searchTimeout);
            const query = document.getElementById('input-music').value.trim();
            const resBox = document.getElementById('results-music');
            const status = document.getElementById('status-music');

            if (!query) {
                resBox.innerHTML = '';
                status.style.display = 'none';
                return;
            }

            status.style.display = 'block';

            searchTimeout = setTimeout(() => {
                fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://api.deezer.com/search?q=' + query)}`)
                    .then(response => response.json())
                    .then(data => {
                        status.style.display = 'none';
                        const parsed = JSON.parse(data.contents);
                        if (!parsed.data || parsed.data.length === 0) {
                            resBox.innerHTML = '<div class="track-artist" style="padding:8px;">No results found</div>';
                            return;
                        }

                        let html = '';
                        parsed.data.slice(0, 15).forEach(item => {
                            const cover = item.album.cover_medium || item.album.cover_small;
                            const title = item.title;
                            const artist = item.artist.name;
                            const fullQuery = `${artist} - ${title}`;

                            html += `
                                <div class="track-item" onclick="sendToBot('music', '${escapeQuotes(fullQuery)}')">
                                    <div class="track-left">
                                        <img class="track-cover" src="${cover}" alt="cover">
                                        <div class="track-info">
                                            <div class="track-title">${escapeHtml(title)}</div>
                                            <div class="track-artist">${escapeHtml(artist)}</div>
                                        </div>
                                    </div>
                                </div>
                            `;
                        });
                        resBox.innerHTML = html;
                    })
                    .catch(() => {
                        status.style.display = 'none';
                    });
            }, 400);
        }

        // Поиск картинок
        function searchPhoto() {
            clearTimeout(searchTimeout);
            const query = document.getElementById('input-photo').value.trim();
            const resBox = document.getElementById('results-photo');
            const status = document.getElementById('status-photo');

            if (!query) {
                resBox.innerHTML = '';
                status.style.display = 'none';
                return;
            }

            status.style.display = 'block';

            searchTimeout = setTimeout(() => {
                status.style.display = 'none';
                let html = '';
                for (let i = 1; i <= 6; i++) {
                    const imgUrl = `https://picsum.photos/seed/${encodeURIComponent(query + i)}/200/200`;
                    const itemTitle = `${query} · Option ${i}`;
                    html += `
                        <div class="track-item" onclick="sendToBot('photo', '${escapeQuotes(query)}')">
                            <div class="track-left">
                                <img class="track-cover" src="${imgUrl}" alt="photo">
                                <div class="track-info">
                                    <div class="track-title">${escapeHtml(itemTitle)}</div>
                                    <div class="track-artist">Collection</div>
                                </div>
                            </div>
                        </div>
                    `;
                }
                resBox.innerHTML = html;
            }, 300);
        }

        function handleDirectLink(type) {
            clearTimeout(searchTimeout);
            const val = document.getElementById(`input-${type}`).value.trim();
            if (val.startsWith('http://') || val.startsWith('https://')) {
                searchTimeout = setTimeout(() => {
                    sendToBot(type, val);
                }, 400);
            }
        }

        function sendToBot(type, queryText) {
            const status = document.getElementById(`status-${type}`);
            if (status) {
                status.innerText = "Sending request to Telegram...";
                status.style.display = 'block';
            }

            try {
                tg.sendData(JSON.stringify({ type: type, query: queryText }));
                setTimeout(() => { tg.close(); }, 300);
            } catch (e) {
                alert("Please launch inside Telegram bot");
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        function escapeQuotes(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '\\"');
        }
    </script>
</body>
</html>
